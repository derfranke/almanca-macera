<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Almanca Macera — Fiiller & Sıfatlar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FF6A3D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Almanca Macera" />
<style>
  :root{
    --bg:#FBF7F1; --card:#FFFFFF; --ink:#1C2138; --muted:#6E7186; --line:#ECE4D8;
    --brand:#FF6A3D; --brand-ink:#C8360F; --gold:#F5A623; --green:#17A673; --red:#E23D3D;
    --blue:#3D8BFF; --blue-ink:#1E5FC2; --pink:#E23D8D; --pink-ink:#B01C68;
    --brand-soft:#FFEDE4; --green-soft:#DFF3EB; --red-soft:#FBE3E3; --blue-soft:#E3EEFF; --pink-soft:#FBE3EF;
    --shadow:0 10px 30px rgba(28,33,56,.10); --radius:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12142A; --card:#1D2140; --ink:#F1F2F8; --muted:#9BA0C2; --line:#2C305C;
      --brand:#FF7A50; --brand-ink:#FFB59B; --gold:#FBBF3E; --green:#2CC58C; --red:#F16565;
      --blue:#5FA0FF; --blue-ink:#A9CCFF; --pink:#F06BB0; --pink-ink:#FFB3DA;
      --brand-soft:#35223A; --green-soft:#16352E; --red-soft:#3A2233; --blue-soft:#1B2547; --pink-soft:#3A2233;
      --shadow:0 12px 34px rgba(0,0,0,.45); }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 40px;}
  .muted{color:var(--muted);}
  .hidden{display:none !important;}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--brand);display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow);}
  .top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.02em;}
  .top p{margin:0;font-size:12px;}

  /* Tages-Ring / Zeit */
  .timecard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;}
  .ring{--p:0;width:64px;height:64px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--green) calc(var(--p)*1%), var(--line) 0);
    display:grid;place-items:center;}
  .ring > span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;
    font-weight:800;font-size:15px;}
  .timecard .info{flex:1;}
  .timecard .info b{font-size:16px;}
  .week{display:flex;gap:4px;margin-top:8px;}
  .week .d{flex:1;text-align:center;font-size:10px;color:var(--muted);}
  .week .bar{height:26px;border-radius:6px;background:var(--line);position:relative;overflow:hidden;margin-bottom:3px;}
  .week .bar>i{position:absolute;bottom:0;left:0;right:0;background:var(--green);}
  .week .bar.today{outline:2px solid var(--brand);}

  .section-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 10px;}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mbtn{text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 14px;box-shadow:var(--shadow);color:inherit;display:flex;flex-direction:column;gap:6px;
    transition:transform .12s ease;font:inherit;}
  .mbtn:active{transform:scale(.97);}
  .mbtn .emo{font-size:30px;}
  .mbtn .name{font-weight:800;font-size:16px;}
  .mbtn .sub{font-size:12px;color:var(--muted);}
  .mbtn.wide{grid-column:1 / -1;}

  .btn{font:inherit;font-weight:800;border:none;border-radius:16px;padding:15px 18px;cursor:pointer;width:100%;transition:transform .1s ease;}
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 0 var(--brand-ink);}
  .btn.primary:active{box-shadow:0 3px 0 var(--brand-ink);transform:translateY(3px);}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn.green{background:var(--green);color:#fff;box-shadow:0 6px 0 #0d6b4a;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .back{background:none;border:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:6px;display:inline-flex;gap:6px;align-items:center;}

  /* Lernkarte */
  .progress-dots{display:flex;gap:5px;justify-content:center;margin:2px 0 14px;flex-wrap:wrap;}
  .progress-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .progress-dots i.on{background:var(--brand);}
  .learncard{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
    padding:24px 18px;text-align:center;margin:4px 0 14px;display:flex;flex-direction:column;gap:6px;align-items:center;}
  .learncard .emo{font-size:44px;}
  .learncard .de{font-size:30px;font-weight:800;letter-spacing:-.02em;}
  .learncard .oku{font-size:15px;color:var(--brand-ink);font-weight:700;background:var(--brand-soft);padding:2px 10px;border-radius:99px;}
  .learncard .tr{font-size:19px;color:var(--muted);font-weight:700;}
  .sentbox{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 12px;margin-top:8px;text-align:left;display:flex;flex-direction:column;gap:4px;}
  .sentbox .sde{font-size:18px;font-weight:800;}
  .sentbox .soku{font-size:14px;color:var(--brand-ink);font-weight:700;}
  .sentbox .str{font-size:14px;color:var(--muted);}
  .conj{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
  .conj span{font-size:13px;font-weight:800;background:var(--blue-soft);color:var(--blue-ink);border-radius:99px;padding:4px 10px;}
  .speakrow{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .speak{border:none;cursor:pointer;background:var(--brand-soft);color:var(--brand-ink);font-weight:800;font-size:14px;border-radius:99px;padding:10px 14px;}
  .speak.big{width:60px;height:60px;border-radius:50%;font-size:26px;padding:0;}
  .speak:active{transform:scale(.93);}

  /* Quiz / Übung */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;}
  .qbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;}
  .qbar>i{display:block;height:100%;background:var(--green);transition:width .3s ease;width:0;}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px 16px;text-align:center;margin-bottom:14px;}
  .qkind{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
  .qword{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px;}
  .qword.sm{font-size:22px;}
  .options{display:grid;gap:10px;}
  .opt{font:inherit;font-weight:700;font-size:17px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;color:var(--ink);transition:transform .1s ease;}
  .opt:active{transform:scale(.98);}
  .opt.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  .opt:disabled{cursor:default;}
  .opt.art-der{}
  .toast{text-align:center;font-weight:800;margin-top:12px;min-height:22px;}
  .toast.good{color:var(--green);}
  .toast.bad{color:var(--red);}

  /* Artikel-Farben */
  .artlegend{display:flex;gap:8px;justify-content:center;margin-bottom:12px;font-size:12px;font-weight:800;}
  .artlegend span{border-radius:99px;padding:4px 10px;}
  .a-der{background:var(--blue-soft);color:var(--blue-ink);}
  .a-die{background:var(--red-soft);color:var(--red);}
  .a-das{background:var(--green-soft);color:var(--green);}

  /* Reading */
  .readtext{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:12px;}
  .readtext .s{display:block;font-size:19px;font-weight:700;margin:6px 0;cursor:pointer;padding:6px 8px;border-radius:10px;}
  .readtext .s:active{background:var(--brand-soft);}
  .readtext .s .tr{display:block;font-size:13px;color:var(--muted);font-weight:600;}

  .celebrate{text-align:center;padding:20px;}
  .celebrate .big{font-size:56px;}
  .toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* =========================================================================
 *  ALMANCA MACERA — Fiiller, Sıfatlar, Zamirler, der/die/das + Okuma
 *  Türk çocukları için Almanca. Dinle → tekrar et → tekrar et.
 * ======================================================================= */

/* ---------- VERİ: FİİLLER (Verben) ------------------------------------ */
/* de=Almanca, ok=okunuşu, tr=anlamı, sd=cümle(Almanca), so=cümle okunuşu,
   st=cümle anlamı, ich/du/er = çekim */
const VERBS = [
  {de:"sein",emo:"⭐",ok:"zayn",tr:"olmak",sd:"Ich bin müde.",so:"iş bin müüde",st:"Yorgunum.",c:{ich:"bin",du:"bist",er:"ist",wir:"sind",ihr:"seid",sie:"sind"}},
  {de:"haben",emo:"🤲",ok:"haaben",tr:"sahip olmak (var)",sd:"Ich habe einen Hund.",so:"iş haabe aynen hunt",st:"Bir köpeğim var.",c:{ich:"habe",du:"hast",er:"hat",wir:"haben",ihr:"habt",sie:"haben"}},

  {de:"kommen",emo:"👋",ok:"komen",tr:"gelmek",sd:"Ich komme nach Hause.",so:"iş kome nah hauze",st:"Eve geliyorum.",c:{ich:"komme",du:"kommst",er:"kommt",wir:"kommen",ihr:"kommt",sie:"kommen"}},

  {de:"essen",emo:"🍎",ok:"esen",tr:"yemek yemek",sd:"Ich esse einen Apfel.",so:"iş ese aynen apfel",st:"Bir elma yiyorum.",c:{ich:"esse",du:"isst",er:"isst",wir:"essen",ihr:"esst",sie:"essen"}},
  {de:"trinken",emo:"🥤",ok:"trinken",tr:"içmek",sd:"Ich trinke Wasser.",so:"iş trinke vasa",st:"Su içiyorum.",c:{ich:"trinke",du:"trinkst",er:"trinkt",wir:"trinken",ihr:"trinkt",sie:"trinken"}},
  {de:"spielen",emo:"⚽",ok:"şpiilen",tr:"oynamak",sd:"Ich spiele Fußball.",so:"iş şpiile fusbal",st:"Futbol oynuyorum.",c:{ich:"spiele",du:"spielst",er:"spielt",wir:"spielen",ihr:"spielt",sie:"spielen"}},

  {de:"lesen",emo:"📖",ok:"leezen",tr:"okumak",sd:"Ich lese ein Buch.",so:"iş leeze ayn buh",st:"Bir kitap okuyorum.",c:{ich:"lese",du:"liest",er:"liest",wir:"lesen",ihr:"lest",sie:"lesen"}},
  {de:"schreiben",emo:"✏️",ok:"şraayben",tr:"yazmak",sd:"Ich schreibe einen Brief.",so:"iş şraaybe aynen briif",st:"Bir mektup yazıyorum.",c:{ich:"schreibe",du:"schreibst",er:"schreibt",wir:"schreiben",ihr:"schreibt",sie:"schreiben"}},
  {de:"sprechen",emo:"💬",ok:"şpreşen",tr:"konuşmak",sd:"Ich spreche Türkisch.",so:"iş şpreşe türkiş",st:"Türkçe konuşuyorum.",c:{ich:"spreche",du:"sprichst",er:"spricht",wir:"sprechen",ihr:"sprecht",sie:"sprechen"}},

  {de:"sehen",emo:"👀",ok:"zeeen",tr:"görmek",sd:"Ich sehe einen Vogel.",so:"iş zee-e aynen foogel",st:"Bir kuş görüyorum.",c:{ich:"sehe",du:"siehst",er:"sieht",wir:"sehen",ihr:"seht",sie:"sehen"}},
  {de:"laufen",emo:"🏃",ok:"laufen",tr:"koşmak",sd:"Ich laufe schnell.",so:"iş laufe şnel",st:"Hızlı koşuyorum.",c:{ich:"laufe",du:"läufst",er:"läuft",wir:"laufen",ihr:"lauft",sie:"laufen"}},
  {de:"schlafen",emo:"😴",ok:"şlaafen",tr:"uyumak",sd:"Ich schlafe im Bett.",so:"iş şlaafe im bet",st:"Yatakta uyuyorum.",c:{ich:"schlafe",du:"schläfst",er:"schläft",wir:"schlafen",ihr:"schlaft",sie:"schlafen"}},

  {de:"kochen",emo:"🍳",ok:"kohen",tr:"yemek pişirmek",sd:"Meine Mutter kocht Suppe.",so:"mayne muta koht zupe",st:"Annem çorba pişiriyor.",c:{ich:"koche",du:"kochst",er:"kocht",wir:"kochen",ihr:"kocht",sie:"kochen"}},
  {de:"fahren",emo:"🚌",ok:"faaren",tr:"(araçla) gitmek",sd:"Ich fahre mit dem Bus.",so:"iş faare mit dem bus",st:"Otobüsle gidiyorum.",c:{ich:"fahre",du:"fährst",er:"fährt",wir:"fahren",ihr:"fahrt",sie:"fahren"}},
  {de:"schwimmen",emo:"🏊",ok:"şvimen",tr:"yüzmek",sd:"Ich schwimme im Meer.",so:"iş şvime im meea",st:"Denizde yüzüyorum.",c:{ich:"schwimme",du:"schwimmst",er:"schwimmt",wir:"schwimmen",ihr:"schwimmt",sie:"schwimmen"}},
  {de:"singen",emo:"🎤",ok:"zingen",tr:"şarkı söylemek",sd:"Ich singe ein Lied.",so:"iş zinge ayn liit",st:"Bir şarkı söylüyorum.",c:{ich:"singe",du:"singst",er:"singt",wir:"singen",ihr:"singt",sie:"singen"}},
  {de:"tanzen",emo:"💃",ok:"tantsen",tr:"dans etmek",sd:"Ich tanze gern.",so:"iş tantse gern",st:"Dans etmeyi severim.",c:{ich:"tanze",du:"tanzt",er:"tanzt",wir:"tanzen",ihr:"tanzt",sie:"tanzen"}},
  {de:"malen",emo:"🎨",ok:"maalen",tr:"resim yapmak",sd:"Ich male ein Bild.",so:"iş maale ayn bilt",st:"Bir resim yapıyorum.",c:{ich:"male",du:"malst",er:"malt",wir:"malen",ihr:"malt",sie:"malen"}},
  {de:"helfen",emo:"🤝",ok:"helfen",tr:"yardım etmek",sd:"Ich helfe meiner Mama.",so:"iş helfe mayna mama",st:"Anneme yardım ediyorum.",c:{ich:"helfe",du:"hilfst",er:"hilft",wir:"helfen",ihr:"helft",sie:"helfen"}},
  {de:"geben",emo:"🎁",ok:"geeben",tr:"vermek",sd:"Ich gebe dir das Buch.",so:"iş geebe diir das buh",st:"Sana kitabı veriyorum.",c:{ich:"gebe",du:"gibst",er:"gibt",wir:"geben",ihr:"gebt",sie:"geben"}},
  {de:"nehmen",emo:"✋",ok:"neemen",tr:"almak",sd:"Ich nehme einen Apfel.",so:"iş neeme aynen apfel",st:"Bir elma alıyorum.",c:{ich:"nehme",du:"nimmst",er:"nimmt",wir:"nehmen",ihr:"nehmt",sie:"nehmen"}},
  {de:"finden",emo:"🔎",ok:"finden",tr:"bulmak",sd:"Ich finde meinen Stift.",so:"iş finde maynen ştift",st:"Kalemimi buluyorum.",c:{ich:"finde",du:"findest",er:"findet",wir:"finden",ihr:"findet",sie:"finden"}},
  {de:"suchen",emo:"🕵️",ok:"zuuhen",tr:"aramak",sd:"Ich suche meine Katze.",so:"iş zuuhe mayne katse",st:"Kedimi arıyorum.",c:{ich:"suche",du:"suchst",er:"sucht",wir:"suchen",ihr:"sucht",sie:"suchen"}},
  {de:"öffnen",emo:"🚪",ok:"öfnen",tr:"açmak",sd:"Ich öffne die Tür.",so:"iş öfne di tüür",st:"Kapıyı açıyorum.",c:{ich:"öffne",du:"öffnest",er:"öffnet",wir:"öffnen",ihr:"öffnet",sie:"öffnen"}},
  {de:"schließen",emo:"🔒",ok:"şliisen",tr:"kapatmak",sd:"Ich schließe das Fenster.",so:"iş şliise das fensta",st:"Pencereyi kapatıyorum.",c:{ich:"schließe",du:"schließt",er:"schließt",wir:"schließen",ihr:"schließt",sie:"schließen"}},
  {de:"fragen",emo:"❓",ok:"fraagen",tr:"sormak",sd:"Ich frage den Lehrer.",so:"iş fraage den leera",st:"Öğretmene soruyorum.",c:{ich:"frage",du:"fragst",er:"fragt",wir:"fragen",ihr:"fragt",sie:"fragen"}},
  {de:"antworten",emo:"🗣️",ok:"antvorten",tr:"cevap vermek",sd:"Ich antworte richtig.",so:"iş antvorte rihtiş",st:"Doğru cevap veriyorum.",c:{ich:"antworte",du:"antwortest",er:"antwortet",wir:"antworten",ihr:"antwortet",sie:"antworten"}},
  {de:"verstehen",emo:"💡",ok:"ferşteen",tr:"anlamak",sd:"Ich verstehe die Frage.",so:"iş ferştee-e di fraage",st:"Soruyu anlıyorum.",c:{ich:"verstehe",du:"verstehst",er:"versteht",wir:"verstehen",ihr:"versteht",sie:"verstehen"}},
  {de:"wissen",emo:"🧠",ok:"visen",tr:"bilmek",sd:"Ich weiß die Antwort.",so:"iş vays di antvort",st:"Cevabı biliyorum.",c:{ich:"weiß",du:"weißt",er:"weiß",wir:"wissen",ihr:"wisst",sie:"wissen"}},
  {de:"denken",emo:"🤔",ok:"denken",tr:"düşünmek",sd:"Ich denke an dich.",so:"iş denke an diş",st:"Seni düşünüyorum.",c:{ich:"denke",du:"denkst",er:"denkt",wir:"denken",ihr:"denkt",sie:"denken"}},
  {de:"lieben",emo:"❤️",ok:"liiben",tr:"sevmek",sd:"Ich liebe meine Familie.",so:"iş liibe mayne familye",st:"Ailemi seviyorum.",c:{ich:"liebe",du:"liebst",er:"liebt",wir:"lieben",ihr:"liebt",sie:"lieben"}},
  {de:"mögen",emo:"😋",ok:"möögen",tr:"hoşlanmak / sevmek",sd:"Ich mag Schokolade.",so:"iş maag şokolaade",st:"Çikolatayı severim.",c:{ich:"mag",du:"magst",er:"mag",wir:"mögen",ihr:"mögt",sie:"mögen"}},
  {de:"wollen",emo:"🙋",ok:"volen",tr:"istemek",sd:"Ich will spielen.",so:"iş vil şpiilen",st:"Oynamak istiyorum.",c:{ich:"will",du:"willst",er:"will",wir:"wollen",ihr:"wollt",sie:"wollen"}},
  {de:"können",emo:"💪",ok:"könen",tr:"yapabilmek",sd:"Ich kann schwimmen.",so:"iş kan şvimen",st:"Yüzebilirim.",c:{ich:"kann",du:"kannst",er:"kann",wir:"können",ihr:"könnt",sie:"können"}},
  {de:"müssen",emo:"⏰",ok:"müsen",tr:"zorunda olmak",sd:"Ich muss lernen.",so:"iş mus lernen",st:"Ders çalışmalıyım.",c:{ich:"muss",du:"musst",er:"muss",wir:"müssen",ihr:"müsst",sie:"müssen"}},

/* =========================================================================
 *  DURUM & KAYIT (localStorage)
 * ======================================================================= */
const LS_KEY = "almanca_v2";
const DAILY_GOAL_MIN = 20;
const state = load();

function load(){
  let s={};
  try{ s = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(_){}
  s.time = s.time || {};        // { "2026-08-31": saniye }
  s.learned = s.learned || {};  // { "verb:gehen": true }
  s.theme = s.theme || "auto";
  return s;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(_){} }
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function secToday(){ return state.time[todayKey()]||0; }
function addLearned(id){ if(!state.learned[id]){ state.learned[id]=true; save(); } }
function learnedCount(){ return Object.keys(state.learned).length; }

/* ---- Süre takibi: sadece çalışırken sayar ---- */
let studyActive=false, tick=null;
function startStudy(){
  if(studyActive) return; studyActive=true;
  tick=setInterval(()=>{
    if(document.hidden) return;
    const k=todayKey(); state.time[k]=(state.time[k]||0)+1;
    if(state.time[k]%5===0) save();      // her 5 sn kaydet
    updateTimeUIifHome();
  },1000);
}
function stopStudy(){ studyActive=false; if(tick){clearInterval(tick);tick=null;} save(); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });

/* =========================================================================
 *  KONUŞMA (TTS) — Almanca dinle, tekrar et
 * ======================================================================= */
let deVoice=null;
function pickVoice(){
  const vs=window.speechSynthesis? speechSynthesis.getVoices():[];
  deVoice = vs.find(v=>/de[-_]/i.test(v.lang)) || vs.find(v=>/german|deutsch/i.test(v.name)) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text, slow){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="de-DE"; if(deVoice) u.voice=deVoice;
    u.rate = slow?0.6:0.85; u.pitch=1.0;
    speechSynthesis.speak(u);
  }catch(_){}
}

 *  YARDIMCI

const app=()=>document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function applyTheme(){
  const r=document.documentElement;
  if(state.theme==="light")r.setAttribute("data-theme","light");
  else if(state.theme==="dark")r.setAttribute("data-theme","dark");
  else r.removeAttribute("data-theme");
}

function updateTimeUIifHome(){
  const ring=document.getElementById("ring"); if(!ring) return;
  const m=Math.floor(secToday()/60), pct=Math.min(100,Math.round(secToday()/(DAILY_GOAL_MIN*60)*100));
  ring.style.setProperty("--p",pct);
  const lbl=document.getElementById("ringlbl"); if(lbl) lbl.textContent=m+" dk";
  const goaltxt=document.getElementById("goaltxt");
  if(goaltxt) goaltxt.innerHTML = m>=DAILY_GOAL_MIN
    ? "🎉 Bugünkü hedef tamam! ("+m+"/"+DAILY_GOAL_MIN+" dk)"
    : "Bugün: <b>"+m+"</b> / "+DAILY_GOAL_MIN+" dk çalıştın";
}

/* ---------- LERN-DECK: Fiiller / Sıfatlar ---------------------------- */
let deck=[], di=0, deckKind="verb";
function LearnDeck(kind){
  deckKind=kind; deck=shuffle(kind==="verb"?VERBS:ADJ).slice(0,10); di=0;
  startStudy(); LearnCard();
}
function LearnCard(){
  if(di>=deck.length){ return DeckQuiz(); }
  const it=deck[di];
  const dots=deck.map((_,i)=>`<i class="${i<=di?'on':''}"></i>`).join("");
  const conj = deckKind==="verb"
    ? `<div class="conj"><span>ich ${esc(it.c.ich)}</span><span>du ${esc(it.c.du)}</span><span>er/sie/es ${esc(it.c.er)}</span><span>wir ${esc(it.c.wir)}</span><span>ihr ${esc(it.c.ihr)}</span><span>sie/Sie ${esc(it.c.sie)}</span></div>` : "";
  app().innerHTML=`
    <button class="back" onclick="Home()">← Ana sayfa</button>
    <div class="progress-dots">${dots}</div>
    <div class="learncard">
      <div class="emo">${it.emo||"📘"}</div>
      <div class="de">${esc(it.de)}</div>
      <div class="oku">okunuşu: ${esc(it.ok)}</div>
      <div class="tr">${esc(it.tr)}</div>
      <div class="sentbox">
        <div class="sde">🇩🇪 ${esc(it.sd)}</div>
        <div class="soku">🗣️ ${esc(it.so)}</div>
        <div class="str">🇹🇷 ${esc(it.st)}</div>
      </div>
      ${conj}
      <div class="speakrow">
        <button class="speak big" title="Kelimeyi dinle" onclick="speak('${esc(it.de)}')">🔊</button>
        <button class="speak" onclick="speak('${esc(it.sd)}')">🔊 Cümle</button>
        <button class="speak" onclick="speak('${esc(it.sd)}',true)">🐢 Yavaş</button>
      </div>
    </div>
    <button class="btn primary" onclick="nextCard()">Öğrendim, devam ✓</button>
  `;
  // otomatik dinle + tekrar et hatırlatması
  speak(it.de);
  addLearned(deckKind+":"+it.de);
}
function nextCard(){ di++; LearnCard(); }

/* ---------- DECK-QUIZ (öğrenileni test et) --------------------------- */
let qz=[], qi=0, qright=0;
function DeckQuiz(){
  const pool=deck.slice();
  qz=shuffle(pool).slice(0,Math.min(5,pool.length)); qi=0; qright=0;
  QuizStep();
}
function QuizStep(){
  if(qi>=qz.length){ return Done(qright,qz.length); }
  const it=qz[qi];
  const others=shuffle((deckKind==="verb"?VERBS:ADJ).filter(x=>x.de!==it.de)).slice(0,3);
  const askDe = Math.random()<0.5;

  const pct=Math.round(qi/qz.length*100);
  app().innerHTML=`
    <div class="qhead">
      <button class="back" onclick="Home()">← Çık</button>
      <div class="qbar"><i style="width:${pct}%"></i></div>
      <div class="muted" style="font-weight:800">${qi+1}/${qz.length}</div>
    </div>
    <div class="qcard">
      <div class="qkind">${askDe?"Bu ne demek?":"Almancası ne?"}</div>
      <div class="qword ${askDe?'':'sm'}">${esc(askDe?it.de:it.tr)}</div>

    </div>
    <div class="options" id="opts">
      ${opts.map(o=>`<button class="opt" onclick="pick(this,'${esc((askDe?o.tr:o.de))}','${esc((askDe?it.tr:it.de))}','${esc(it.de)}')">${esc(askDe?o.tr:o.de)}</button>`).join("")}
    </div>
    <div class="toast" id="toast"></div>
  `;
}
function pick(btn,chosen,correct,deWord){
  const opts=document.getElementById("opts"); [...opts.children].forEach(b=>b.disabled=true);
  const t=document.getElementById("toast");
  if(chosen===correct){ btn.classList.add("correct"); qright++; t.textContent="Doğru! 🎉"; t.className="toast good"; speak(deWord); }
  else{ btn.classList.add("wrong"); t.textContent="Doğru cevap: "+correct; t.className="toast bad";
    [...opts.children].forEach(b=>{ if(b.textContent===correct)b.classList.add("correct"); }); }
  setTimeout(()=>{ qi++; QuizStep(); }, chosen===correct?800:1600);
}

/* ---------- ich/du/er çekim alıştırması ------------------------------ */
function Pron(){
  startStudy();
  const v=VERBS[Math.floor(Math.random()*VERBS.length)];
  const persons=[["ich",v.c.ich],["du",v.c.du],["er/sie/es",v.c.er],["wir",v.c.wir],["ihr",v.c.ihr],["sie/Sie",v.c.sie]];
  const pick=persons[Math.floor(Math.random()*persons.length)];
  const correct=pick[1];
  const full=pick[0].split("/")[0]+" "+correct; // temiz okunuş (er/sie/es -> er)
  const wrong=[...new Set(persons.map(p=>p[1]).filter(f=>f!==correct))];
  const opts=shuffle([correct, ...shuffle(wrong).slice(0,3)]);
  app().innerHTML=`
    <div class="qhead"><button class="back" onclick="Home()">← Çık</button>
      <div class="muted" style="font-weight:800">👤 Çekim</div></div>
    <div class="qcard">

      <div class="muted">doğru eki seç</div>
    </div>
    <div class="options" id="opts">
      ${opts.map(o=>`<button class="opt" onclick="pickPron(this,'${esc(o)}','${esc(correct)}','${esc(full)}')">${esc(pick[0])} <b>${esc(o)}</b></button>`).join("")}
    </div>
    <div class="toast" id="toast"></div>
    <button class="btn ghost" style="margin-top:8px" onclick="Pron()">Yeni →</button>
  `;
}
function pickPron(btn,chosen,correct,full){
  const opts=document.getElementById("opts"); [...opts.children].forEach(b=>b.disabled=true);
  const t=document.getElementById("toast");
  if(chosen===correct){ btn.classList.add("correct"); t.textContent="Doğru! → "+full; t.className="toast good"; speak(full); addLearned("pron:"+full); }
  else{ btn.classList.add("wrong"); t.textContent="Doğru: "+full; t.className="toast bad";
    [...opts.children].forEach(b=>{ if(b.textContent===correct)b.classList.add("correct"); }); }

}

/* ---------- mein/dein/sein ------------------------------------------ */
function Poss(){
  startStudy();
  const n=NOUNS[Math.floor(Math.random()*NOUNS.length)];
  const p=POSS_P[Math.floor(Math.random()*POSS_P.length)];
  const isDie = n.art==="die";
  const correct = isDie ? p.e : p.k;          // die -> +e (meine), der/das -> (mein)
  const wrongEnd = isDie ? p.k : p.e;         // gleiche Person, falsche Endung
  const other = POSS_P[(POSS_P.indexOf(p)+1+Math.floor(Math.random()*(POSS_P.length-1)))%POSS_P.length];
  const otherForm = isDie ? other.e : other.k;
  const opts = shuffle([...new Set([correct, wrongEnd, otherForm])]);
  const full = correct+" "+n.w;
  const artClass = n.art==="der"?"a-der":isDie?"a-die":"a-das";
  app().innerHTML=`
    <div class="qhead"><button class="back" onclick="Home()">← Çık</button>
      <div class="muted" style="font-weight:800">🗝️ İyelik</div></div>
    <div class="artlegend"><span class="a-der">der</span><span class="a-die">die</span><span class="a-das">das</span></div>
    <div class="qcard">
      <div class="qkind">${esc(p.tr)}</div>
      <div style="font-size:40px">${n.emo}</div>
      <div class="qword">____ <span class="${artClass}" style="padding:2px 10px;border-radius:8px">${esc(n.w)}</span></div>
      <div class="muted">${esc(n.tr)} · kural: <b>die → +e</b> (meine) · der/das → (mein)</div>
    </div>
    <div class="options" id="opts">
      ${opts.map(o=>`<button class="opt" onclick="pickPoss(this,'${esc(o)}','${esc(correct)}','${esc(full)}')"><b>${esc(o)}</b> ${esc(n.w)}</button>`).join("")}
    </div>
    <div class="toast" id="toast"></div>
    <button class="btn ghost" style="margin-top:8px" onclick="Poss()">Yeni →</button>
  `;
}
function pickPoss(btn,chosen,correct,full){
  const opts=document.getElementById("opts"); [...opts.children].forEach(b=>b.disabled=true);
  const t=document.getElementById("toast");
  if(chosen===correct){ btn.classList.add("correct"); t.innerHTML="Doğru! → <b>"+full+"</b>"; t.className="toast good"; speak(full); addLearned("poss:"+full); }
  else{ btn.classList.add("wrong"); t.innerHTML="Doğru: <b>"+full+"</b>"; t.className="toast bad";
    [...opts.children].forEach(b=>{ if(b.querySelector("b") && b.querySelector("b").textContent===correct)b.classList.add("correct"); }); }

}

/* ---------- OKUMA (Leseübung) --------------------------------------- */
function Reading(){
  startStudy();
  app().innerHTML=`
    <button class="back" onclick="Home()">← Ana sayfa</button>
    <div class="section-label">Okuma — bir metin seç</div>
    <div class="menu">
      ${TEXTS.map((t,i)=>`<button class="mbtn wide" onclick="ReadText(${i})"><span class="name">${esc(t.title)}</span><span class="sub">${t.lines.length} cümle · dokun & dinle</span></button>`).join("")}
    </div>
  `;
}
function ReadText(i){
  const t=TEXTS[i];
  app().innerHTML=`
    <button class="back" onclick="Reading()">← Metinler</button>
    <h2 style="margin:6px 2px 10px">${esc(t.title)}</h2>
    <div class="muted" style="margin:0 2px 10px">Her cümleye dokun → dinle ve yüksek sesle tekrar et 🎤</div>
    <div class="readtext">
      ${t.lines.map(l=>`<span class="s" onclick="speak('${esc(l.de)}')">${esc(l.de)}<span class="tr">${esc(l.tr)}</span></span>`).join("")}
    </div>
    <div class="row2">
      <button class="btn ghost" onclick="readAll(${i})">🔊 Hepsini dinle</button>
      <button class="btn green" onclick="Done(t_done(${i}),${t.lines.length})">Okudum ✓</button>
    </div>
  `;
}
function t_done(i){ addLearned("read:"+i); return TEXTS[i].lines.length; }
let readTimer=null;
function readAll(i){
  const lines=TEXTS[i].lines; let k=0;
  if(readTimer) clearInterval(readTimer);
  const step=()=>{ if(k>=lines.length){clearInterval(readTimer);return;} speak(lines[k].de); k++; };
  step(); readTimer=setInterval(step, 2600);
}

/* ---------- BİTİŞ ekranı -------------------------------------------- */
function Done(right,total){
  stopStudy();
  const m=Math.floor(secToday()/60);
  app().innerHTML=`
    <div class="celebrate">
      <div class="big">${right>=Math.ceil(total*0.6)?"🎉":"💪"}</div>
      <h2>Aferin!</h2>
      <p class="muted">${total?("Doğru: <b>"+right+"/"+total+"</b><br>"):""}Bugün toplam <b>${m}</b> dakika çalıştın.</p>
    </div>
    <button class="btn primary" onclick="Home()">Ana sayfa</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="Home()">Devam et</button>
  `;
  if(right>=Math.ceil((total||1)*0.6)) speak("Sehr gut!");
}
