<meta charset="utf-8" />
<title>Almanca Macera — Türkler için Almanca</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FF6A3D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  :root {
    --bg:#FBF7F1; --card:#FFFFFF; --ink:#1C2138; --muted:#6E7186; --line:#ECE4D8;
    --brand:#FF6A3D; --brand-ink:#C8360F; --gold:#F5A623; --green:#17A673; --red:#E23D3D;
    --brand-soft:#FFEDE4; --green-soft:#DFF3EB; --red-soft:#FBE3E3;
    --shadow:0 10px 30px rgba(28,33,56,.10); --radius:20px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12142A; --card:#1D2140; --ink:#F1F2F8; --muted:#9BA0C2; --line:#2C305C;
      --brand:#FF7A50; --brand-ink:#FFB59B; --gold:#FBBF3E; --green:#2CC58C; --red:#F16565;
      --brand-soft:#35223A; --green-soft:#16352E; --red-soft:#3A2233; --shadow:0 12px 34px rgba(0,0,0,.45); }
  }
  :root[data-theme="light"] { --bg:#FBF7F1; --card:#FFFFFF; --ink:#1C2138; --muted:#6E7186; --line:#ECE4D8;
    --brand:#FF6A3D; --brand-ink:#C8360F; --gold:#F5A623; --green:#17A673; --red:#E23D3D;
    --brand-soft:#FFEDE4; --green-soft:#DFF3EB; --red-soft:#FBE3E3; --shadow:0 10px 30px rgba(28,33,56,.10); }
  :root[data-theme="dark"] { --bg:#12142A; --card:#1D2140; --ink:#F1F2F8; --muted:#9BA0C2; --line:#2C305C;
    --brand:#FF7A50; --brand-ink:#FFB59B; --gold:#FBBF3E; --green:#2CC58C; --red:#F16565;
    --brand-soft:#35223A; --green-soft:#16352E; --red-soft:#3A2233; --shadow:0 12px 34px rgba(0,0,0,.45); }

  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-size:16px; line-height:1.4; -webkit-tap-highlight-color:transparent; }
  #app { max-width:480px; margin:0 auto; min-height:100vh; padding:16px 16px 40px; }
  .display { font-weight:800; letter-spacing:-.02em; text-wrap:balance; }
  .tnum { font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); }

  .top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .logo { width:42px; height:42px; border-radius:12px; background:var(--brand); display:grid; place-items:center; font-size:22px; box-shadow:var(--shadow); }
  .top h1 { font-size:19px; margin:0; }
  .top p { margin:0; font-size:12px; }

  .stats { display:flex; flex-direction:column; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow); margin-bottom:14px; }
  .pills { display:flex; gap:8px; }
  .pills .pill { flex:1; justify-content:center; }
  .lvl { display:flex; align-items:center; gap:10px; }
  .lvl .badge { width:40px; height:40px; border-radius:50%; background:var(--brand-soft); color:var(--brand-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
  .xpbar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:5px; }
  .xpbar > i { display:block; height:100%; background:var(--brand); width:0; transition:width .5s ease; }
  .pill { display:flex; align-items:center; gap:5px; font-weight:800; font-size:15px; background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:6px 11px; }

  .daily { background:linear-gradient(135deg,var(--brand),#ff9a3d); color:#fff; border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:18px; }
  .daily.done { background:var(--green); }
  .daily .dl { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.9; }
  .daily h2 { margin:4px 0 10px; font-size:18px; }
  .daily .gobtn { background:#fff; color:var(--brand-ink); border:none; border-radius:14px; padding:12px; font:inherit; font-weight:800; width:100%; cursor:pointer; }
  .daily.done .gobtn { color:var(--green); }

  .section-label { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:4px 2px 12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .theme { text-align:left; cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); color:inherit; display:flex; flex-direction:column; gap:8px; transition:transform .12s ease; font:inherit; }
  .theme:active { transform:scale(.97); }
  .theme .emo { font-size:30px; }
  .theme .name { font-weight:800; font-size:15.5px; }
  .theme .meta { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
  .stars { color:var(--gold); letter-spacing:1px; font-size:13px; }
  .stars .off { color:var(--line); }
  .theme.locked { opacity:.5; cursor:default; }
  .theme .tgbar { height:6px; border-radius:99px; background:var(--line); overflow:hidden; }
  .theme .tgbar > i { display:block; height:100%; background:var(--gold); }
  .unlockban { background:var(--gold); color:#3a2600; font-weight:800; text-align:center; padding:12px; border-radius:16px; margin-bottom:14px; }

  .btn { font:inherit; font-weight:800; border:none; border-radius:16px; padding:15px 18px; cursor:pointer; width:100%; transition:transform .1s ease; }
  .btn:active { transform:translateY(1px) scale(.99); }
  .btn.primary { background:var(--brand); color:#fff; box-shadow:0 6px 0 var(--brand-ink); }
  .btn.primary:active { box-shadow:0 3px 0 var(--brand-ink); transform:translateY(3px); }
  .btn.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn.gold { background:var(--gold); color:#3a2600; box-shadow:0 6px 0 #b9781a; }
  .btn.green { background:var(--green); color:#fff; box-shadow:0 6px 0 #0d6b4a; }
  .btn.coin { background:linear-gradient(135deg,#F5A623,#ffd166); color:#3a2600; box-shadow:0 6px 0 #b9781a; }
  .btn.coin:active { box-shadow:0 3px 0 #b9781a; transform:translateY(3px); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .back { background:none; border:none; color:var(--muted); font:inherit; font-weight:700; cursor:pointer; padding:6px 0; margin-bottom:6px; display:inline-flex; gap:6px; align-items:center; }

  .learncard { background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); padding:26px 20px; text-align:center; margin:6px 0 16px; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .learncard .emo { font-size:52px; }
  .learncard .de { font-size:29px; font-weight:800; letter-spacing:-.02em; }
  .learncard .tr { font-size:18px; color:var(--muted); font-weight:600; }
  .learncard .ex { font-size:14px; color:var(--muted); margin-top:4px; }
  .speak { width:56px; height:56px; border-radius:50%; border:none; cursor:pointer; background:var(--brand-soft); color:var(--brand-ink); font-size:24px; margin-top:6px; }
  .speak:active { transform:scale(.92); }
  .progress-dots { display:flex; gap:5px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
  .progress-dots i { width:8px; height:8px; border-radius:50%; background:var(--line); }
  .progress-dots i.on { background:var(--brand); }

  .qhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .hearts { font-size:18px; letter-spacing:2px; }
  .qbar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; flex:1; margin:0 12px; }
  .qbar > i { display:block; height:100%; background:var(--green); transition:width .3s ease; }
  .qcard { background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); padding:26px 18px; text-align:center; margin-bottom:16px; }
  .qkind { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .qword { font-size:30px; font-weight:800; letter-spacing:-.02em; margin:8px 0; }
  .qword.tr { font-size:24px; }
  .options { display:grid; gap:10px; }
  .opt { font:inherit; font-weight:700; font-size:17px; text-align:center; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:15px; cursor:pointer; color:var(--ink); transition:transform .1s ease; }
  .opt:active { transform:scale(.98); }
  .opt.correct { background:var(--green-soft); border-color:var(--green); color:var(--green); }
  .opt.wrong { background:var(--red-soft); border-color:var(--red); color:var(--red); }
  .opt:disabled { cursor:default; }
  .toast { text-align:center; font-weight:800; margin-top:14px; min-height:24px; }
  .toast.good { color:var(--green); }
  .toast.bad { color:var(--red); }

  /* eşleştirme */
  .match-cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mcol { display:flex; flex-direction:column; gap:10px; }
  .mitem { font:inherit; font-weight:700; font-size:15px; text-align:center; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px 8px; cursor:pointer; color:var(--ink); min-height:52px; transition:transform .1s ease; }
  .mitem:active { transform:scale(.97); }
  .mitem.sel { border-color:var(--brand); background:var(--brand-soft); color:var(--brand-ink); }
  .mitem.done { border-color:var(--green); background:var(--green-soft); color:var(--green); opacity:.55; cursor:default; }
  .mitem.bad { border-color:var(--red); background:var(--red-soft); color:var(--red); }

  /* telaffuz */
  .mic { width:96px; height:96px; border-radius:50%; border:none; cursor:pointer; background:var(--brand); color:#fff; font-size:40px; margin:8px auto; display:grid; place-items:center; box-shadow:0 8px 0 var(--brand-ink); }
  .mic:active { transform:translateY(4px); box-shadow:0 4px 0 var(--brand-ink); }
  .mic.rec { background:var(--red); box-shadow:0 8px 0 #a11; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }

  .numgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .numbtn { font:inherit; font-weight:800; font-size:22px; padding:16px 0; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .numbtn:active { transform:scale(.96); }
  .numbtn.correct { background:var(--green-soft); border-color:var(--green); color:var(--green); }
  .numbtn.wrong { background:var(--red-soft); border-color:var(--red); color:var(--red); }
  .winput { width:100%; font:inherit; font-size:20px; font-weight:800; text-align:center; padding:14px; border-radius:16px; border:2px solid var(--line); background:var(--card); color:var(--ink); }
  .winput:focus { outline:none; border-color:var(--brand); }

  .shopgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .shopcard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 8px; text-align:center; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; align-items:center; }
  .shopcard .semo { font-size:34px; }
  .shopcard .semo.locked { filter:grayscale(1); opacity:.4; }
  .shopcard .swatch { width:38px; height:38px; border-radius:50%; margin-top:4px; }
  .shopcard .sname { font-size:12px; font-weight:700; }
  .sbtn { font:inherit; font-weight:800; font-size:12px; border:none; border-radius:10px; padding:7px 8px; cursor:pointer; background:var(--gold); color:#3a2600; width:100%; }
  .sbtn.off { background:var(--line); color:var(--muted); cursor:default; }
  .sbtn.on { background:var(--green-soft); color:var(--green); }
  .sbtn.eq { background:var(--brand); color:#fff; }

  .result { text-align:center; padding-top:20px; }
  .result .big { font-size:64px; }
  .result h2 { font-size:26px; margin:6px 0; }
  .bigstars { font-size:40px; letter-spacing:6px; color:var(--gold); margin:10px 0; }
  .bigstars .off { color:var(--line); }
  .reward { display:inline-flex; gap:8px; align-items:center; background:var(--gold); color:#3a2600; font-weight:800; padding:8px 16px; border-radius:99px; margin:8px 0 20px; }

  .themeicon { font-size:44px; text-align:center; margin-top:4px; }
  .themetitle { text-align:center; font-size:24px; font-weight:800; margin:2px 0 2px; }
  .themesub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:20px; }
  .foot { text-align:center; color:var(--muted); font-size:11px; margin-top:26px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

  var KEY = "almancaMacera_v2";

  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.xp != null) {
      if (s.coins == null) s.coins = 0; if (!s.tgold) s.tgold = {};
      if (!s.owned) s.owned = { avatars:[], colors:[], stickers:[] };
      if (!s.avatar) s.avatar = "🇩🇪"; if (s.color == null) s.color = ""; return s; } } catch (e) {}

  }

  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
  function bumpStreak() {
    var t = todayStr(); if (state.lastDay === t) return;
    var y = new Date(); y.setDate(y.getDate()-1);
    var ys = y.getFullYear() + "-" + (y.getMonth()+1) + "-" + y.getDate();
    state.streak = (state.lastDay === ys) ? state.streak + 1 : 1;
    state.lastDay = t; save();
  }
  function addXp(n) { state.xp += n; save(); }

  function themePassed(id) { return themeGold(id) >= TARGET; }
  function themeIndex(id) { for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return i; return -1; }
  function isUnlocked(id) { var i = themeIndex(id); if (i <= 0) return true; return themePassed(THEMES[i-1].id); }

  function award(themeId, coins) {
    var wasPassed = themeId && findTheme(themeId) ? themePassed(themeId) : true;
    state.coins = (state.coins || 0) + coins;
    if (themeId && findTheme(themeId)) { state.tgold[themeId] = themeGold(themeId) + coins; }
    save();
    return !wasPassed && themeId && findTheme(themeId) && themePassed(themeId);
  }

    var seed = daySeed();
    var words = seededPick(allWordItems(), 10, seed);
    var sents = seededPick(allSentenceItems(), 5, seed + 7);
    return { id:"daily", name:"Günün Hedefi", emo:"🎯", words: words.concat(sents), kind:"daily" };
  }

  // ============ SES ============
  var voices = [];
  function loadVoices() { try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) {} }
  if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function speak(text) {
    if (!window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text); u.lang = "de-DE"; u.rate = 0.9;
      var v = voices.filter(function (x) { return x.lang && x.lang.toLowerCase().indexOf("de") === 0; })[0];
      if (v) u.voice = v; speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ============ KONUŞMA TANIMA (telaffuz) ============
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function norm(s) { return String(s).toLowerCase()
    .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
    .replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }
  function pronOk(target, alts) {
    var t = norm(target);
    for (var i = 0; i < alts.length; i++) {
      var a = norm(alts[i]); if (!a) continue;
      if (a === t) return true;
      if (t.split(" ").length === 1) { if (a.indexOf(t) >= 0 || t.indexOf(a) >= 0) return true; }
      else { var tw = t.split(" "), aw = a.split(" "), hit = 0;
        for (var j = 0; j < tw.length; j++) if (aw.indexOf(tw[j]) >= 0) hit++;
        if (hit / tw.length >= 0.6) return true; }
    }
    return false;
  }

  function shuffle(a) { a = a.slice(); for (var i = a.length-1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function starStr(n) { var s = ""; for (var i = 0; i < 3; i++) s += (i < n) ? "★" : "<span class='off'>★</span>"; return s; }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function findTheme(id) { for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return THEMES[i]; }

  // ============ ÖĞREN ============
  function learn(deck, i, onBack) {
    var w = deck.words[i];
    var dots = deck.words.map(function (_, k) { return '<i class="' + (k === i ? "on" : "") + '"></i>'; }).join("");

        '<button class="btn ' + (last ? 'gold' : 'primary') + '" id="next">' + (last ? '🎮 Teste geç' : 'İleri ›') + '</button></div>' +
      '<div class="foot tnum">' + (i+1) + ' / ' + deck.words.length + '</div>';

    var p = app.querySelector("#prev"); if (p) p.onclick = function () { if (i > 0) learn(deck, i-1, onBack); };
    app.querySelector("#next").onclick = function () {
      if (last) { if (deck.kind === "daily") startDailyQuiz(deck); else quiz(deck, onBack, { stars:true }); }
      else learn(deck, i+1, onBack);
    };
    speak(w.de);
  }
  function startDailyQuiz(deck) { quiz(deck, home, { daily:true }); }

  // ============ TEST (quiz) ============
  function quiz(deck, back, opts) {
    opts = opts || {};
    var pool = deck.words;
    var qs = shuffle(pool).slice(0, Math.min(8, pool.length)).map(function (w) {
      var kinds = w.de.length > 16 ? ["de2tr", "listen"] : ["de2tr", "tr2de", "listen"];
      var kind = kinds[Math.floor(Math.random() * kinds.length)];
      var others = shuffle(pool.filter(function (x) { return x.de !== w.de; }));
      if (kind === "tr2de") {
        return { kind:kind, prompt:w.tr, answer:w.de, opts:shuffle([w.de].concat(others.slice(0,3).map(function (x){return x.de;}))), say:w.de };
      }
      return { kind:kind, prompt:w.de, answer:w.tr, opts:shuffle([w.tr].concat(others.slice(0,3).map(function (x){return x.tr;}))), say:w.de };
    });
    runQuiz(deck, qs, 0, { correct:0, hearts:3, xp:0, combo:0 }, back, opts);
  }
  function runQuiz(deck, qs, idx, sc, back, opts) {
    if (idx >= qs.length || sc.hearts <= 0) return quizResult(deck, qs, sc, back, opts);
    var q = qs[idx], hearts = "";
    for (var h = 0; h < 3; h++) hearts += h < sc.hearts ? "❤️" : "🤍";
    var promptHtml, kindLabel;
    if (q.kind === "listen") { kindLabel = "🔊 Dinle ve seç"; promptHtml = '<button class="speak" id="say" style="margin:6px auto">🔊</button>'; }
    else if (q.kind === "tr2de") { kindLabel = "Almancası hangisi?"; promptHtml = '<div class="qword tr">' + esc(q.prompt) + '</div>'; }
    else { kindLabel = "Türkçesi ne demek?"; promptHtml = '<div class="qword">' + esc(q.prompt) + '</div><button class="speak" id="say" style="width:44px;height:44px;font-size:19px;margin:2px auto">🔊</button>'; }
    app.innerHTML =
      '<div class="qhead"><button class="back" id="bk">‹ Çık</button>' +
        '<div class="qbar"><i style="width:' + (idx/qs.length*100) + '%"></i></div>' +
        '<div class="hearts">' + hearts + '</div></div>' +
      '<div class="qcard"><div class="qkind">' + kindLabel + '</div>' + promptHtml + '</div>' +
      '<div class="options">' + q.opts.map(function (o, k) { return '<button class="opt" data-k="' + k + '">' + esc(o) + '</button>'; }).join("") + '</div>' +
      '<div class="toast" id="toast"></div>';
    app.querySelector("#bk").onclick = function () { if (confirm("Çıkılsın mı? İlerleme kaydedilmez.")) back(); };
    var sayBtn = app.querySelector("#say"); if (sayBtn) sayBtn.onclick = function () { speak(q.say); };
    if (q.kind === "listen") speak(q.say);
    var opts2 = app.querySelectorAll(".opt");
    Array.prototype.forEach.call(opts2, function (b) {
      b.onclick = function () {
        var chosen = q.opts[+b.getAttribute("data-k")], ok = chosen === q.answer;
        Array.prototype.forEach.call(opts2, function (x) { x.disabled = true; if (q.opts[+x.getAttribute("data-k")] === q.answer) x.classList.add("correct"); });
        var toast = app.querySelector("#toast");
        if (ok) { b.classList.add("correct"); sc.correct++; sc.combo++; sc.xp += 10 + Math.min(sc.combo-1,5)*2;
          toast.className = "toast good"; toast.textContent = sc.combo >= 3 ? "Süper! 🔥 x" + sc.combo : "Doğru! ✅"; speak(q.say); }
        else { b.classList.add("wrong"); sc.hearts--; sc.combo = 0; toast.className = "toast bad"; toast.textContent = "Doğrusu: " + q.answer; }
        setTimeout(function () { runQuiz(deck, qs, idx+1, sc, back, opts); }, ok ? 750 : 1400);
      };
    });
  }
  function quizResult(deck, qs, sc, back, opts) {
    var total = qs.length, ratio = sc.correct / total;
    var stars = sc.hearts <= 0 ? Math.min(1, Math.floor(ratio*3)) : (ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1);
    if (sc.correct === 0) stars = 0;
    if (opts.stars) { if (!state.stars[deck.id] || stars > state.stars[deck.id]) state.stars[deck.id] = stars; }
    var bonus = 0;
    if (opts.daily && state.dailyDone !== todayStr()) { state.dailyDone = todayStr(); bonus = 25; }
    var coins = sc.correct * 3 + (bonus ? 10 : 0);
    var unlocked = award(deck.id, coins);
    addXp(sc.xp + bonus); bumpStreak(); save();
    var passed = sc.hearts > 0;
    app.innerHTML =
      (unlocked ? '<div class="unlockban">🔓 Yeni bölüm açıldı: ' + nextThemeName(deck.id) + '! 🎉</div>' : '') +
      '<div class="result"><div class="big">' + (stars >= 3 ? "🏆" : stars >= 2 ? "🎉" : passed ? "👍" : "💪") + '</div>' +
      '<h2 class="display">' + (opts.daily ? "Günün hedefi tamam!" : stars >= 2 ? "Harikasın!" : passed ? "Aferin!" : "Az kaldı!") + '</h2>' +
      '<div class="bigstars">' + starStr(stars) + '</div>' +
      '<p class="muted tnum">' + sc.correct + ' / ' + total + ' doğru</p>' +
      '<div class="reward" style="background:var(--gold)">🪙 +' + coins + '</div> <div class="reward">⭐ +' + (sc.xp + bonus) + ' XP</div>' +
      '<div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">' +
        '<button class="btn primary" id="again">🔁 Tekrar</button>' +
        '<button class="btn ghost" id="home">🏠 Ana sayfa</button></div></div>';
    app.querySelector("#again").onclick = function () { quiz(deck, back, opts); };
    app.querySelector("#home").onclick = home;
  }

  // ============ EŞLEŞTİR (Paare finden) ============
  function matching(deck, back) {
    var pairs = shuffle(deck.words).slice(0, Math.min(6, deck.words.length));
    var left = shuffle(pairs), right = shuffle(pairs);
    var sel = { side:null, idx:null }, matched = 0, moves = 0, xp = 0;
    render();
    function render() {
      app.innerHTML =
        '<button class="back" id="bk">‹ Çık</button>' +
        '<div class="themetitle" style="font-size:20px">🧩 Eşleştir</div>' +
        '<div class="themesub">Almanca ↔ Türkçe: doğru çiftleri bul</div>' +
        '<div class="match-cols"><div class="mcol" id="L"></div><div class="mcol" id="R"></div></div>' +
        '<div class="foot tnum" id="mst">' + matched + ' / ' + pairs.length + ' eşleşti</div>';
      app.querySelector("#bk").onclick = back;
      fill("L", left, "de"); fill("R", right, "tr");
    }
    function fill(col, arr, field) {
      var c = app.querySelector("#" + col);
      arr.forEach(function (w, i) {
        var b = document.createElement("button");
        b.className = "mitem"; b.textContent = w[field];
        if (w._done) { b.classList.add("done"); b.disabled = true; }
        if (sel.side === col && sel.idx === i) b.classList.add("sel");
        b.onclick = function () { pick(col, i, w, b); };
        c.appendChild(b);
      });
    }
    function pick(col, i, w, b) {
      if (w._done) return;
      if (col === "L") speak(w.de);
      if (!sel.side) { sel = { side:col, idx:i, w:w }; b.classList.add("sel"); return; }
      if (sel.side === col) { // aynı taraf -> seçimi değiştir
        sel = { side:col, idx:i, w:w }; render(); return;
      }
      moves++;
      if (sel.w === w) { // eşleşti
        w._done = true; sel.w._done = true; matched++; xp += 8;
        sel = { side:null, idx:null };
        if (matched >= pairs.length) { addXp(xp); bumpStreak(); return finish(); }
        render();
      } else {
        // yanlış: kısa kırmızı, sonra sıfırla
        b.classList.add("bad");
        var other = app.querySelectorAll(".mitem.sel"); Array.prototype.forEach.call(other, function (x){ x.classList.add("bad"); });
        var keep = sel; sel = { side:null, idx:null };
        setTimeout(function () { render(); }, 650);
      }
    }
    function finish() {
      var coins = pairs.length * 3;
      var unlocked = award(deck.id, coins);
      app.innerHTML =
        (unlocked ? '<div class="unlockban">🔓 Yeni bölüm açıldı: ' + nextThemeName(deck.id) + '! 🎉</div>' : '') +
        '<div class="result"><div class="big">🧩</div><h2 class="display">Hepsini buldun!</h2>' +
        '<div class="bigstars">' + starStr(moves <= pairs.length + 1 ? 3 : moves <= pairs.length + 4 ? 2 : 1) + '</div>' +
        '<p class="muted tnum">' + moves + ' denemede</p>' +
        '<div class="reward" style="background:var(--gold)">🪙 +' + coins + '</div> <div class="reward">⭐ +' + xp + ' XP</div>' +
        '<div style="display:flex;flex-direction:column;gap:12px"><button class="btn primary" id="again">🔁 Tekrar</button>' +
        '<button class="btn ghost" id="home">🏠 Ana sayfa</button></div></div>';
      app.querySelector("#again").onclick = function () { matching(deck, back); };
      app.querySelector("#home").onclick = home;
    }
  }

  // ============ TELAFFUZ (Aussprache testen) ============
  function pronounce(deck, back) {
    var items = shuffle(deck.words).slice(0, Math.min(6, deck.words.length));
    var idx = 0, correct = 0, xp = 0;
    step();
    function step() {
      if (idx >= items.length) return finish();
      var w = items[idx], supported = !!SR;
      app.innerHTML =
        '<div class="qhead"><button class="back" id="bk">‹ Çık</button>' +
          '<div class="qbar"><i style="width:' + (idx/items.length*100) + '%"></i></div>' +
          '<div class="tnum" style="font-weight:800">' + (idx+1) + '/' + items.length + '</div></div>' +
        '<div class="qcard"><div class="qkind">🎤 Bunu söyle</div>' +
          '<div class="qword">' + esc(w.de) + '</div>' +
          '<div class="tr" style="color:var(--muted);font-weight:600">' + esc(w.tr) + '</div>' +
          '<button class="speak" id="hear" style="margin:8px auto">🔊</button></div>' +
        '<button class="mic" id="mic">🎤</button>' +
        '<div class="toast" id="toast">' + (supported ? 'Mikrofona dokun ve söyle' : '') + '</div>' +
        (supported ? '' : '<div class="foot">Bu tarayıcı mikrofonla testi desteklemiyor.<br>Dinle 🔊 ve yüksek sesle tekrar et — sonra “Yaptım”a bas.</div>') +
        '<div style="margin-top:14px"><button class="btn ghost" id="skip">Atla / Sonraki ›</button></div>';
      app.querySelector("#bk").onclick = back;
      app.querySelector("#hear").onclick = function () { speak(w.de); };
      app.querySelector("#skip").onclick = function () { idx++; step(); };
      speak(w.de);
      var mic = app.querySelector("#mic"), toast = app.querySelector("#toast");
      if (!supported) {
        mic.textContent = "👍"; mic.onclick = function () { correct++; xp += 8; good("Aferin! 👏"); };
        return;
      }
      mic.onclick = function () { listen(w, mic, toast); };
    }
    function good(msg) { var toast = app.querySelector("#toast"); if (toast){ toast.className = "toast good"; toast.textContent = msg; } setTimeout(function(){ idx++; step(); }, 900); }
    function listen(w, mic, toast) {
      var rec;
      try { rec = new SR(); } catch (e) { toast.className = "toast bad"; toast.textContent = "Mikrofon açılamadı."; return; }
      rec.lang = "de-DE"; rec.interimResults = false; rec.maxAlternatives = 4;
      mic.classList.add("rec"); toast.className = "toast"; toast.textContent = "Dinliyorum... 🎙️";
      var got = false;
      rec.onresult = function (e) {
        got = true; var alts = [];
        for (var i = 0; i < e.results[0].length; i++) alts.push(e.results[0][i].transcript);
        mic.classList.remove("rec");
        if (pronOk(w.de, alts)) { correct++; xp += 12; good("Doğru! 👏 +12 XP"); }
        else { toast.className = "toast bad"; toast.textContent = "Duyduğum: “" + (alts[0] || "—") + "”. Tekrar dene 🔁"; }
      };
      rec.onerror = function (e) {
        mic.classList.remove("rec"); toast.className = "toast bad";
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          toast.textContent = "Mikrofon izni yok. 🔊 dinle ve tekrar et, sonra “👍 Yaptım”.";
          mic.textContent = "👍"; mic.classList.remove("rec");
          mic.onclick = function () { correct++; xp += 6; good("Aferin! 👏"); };
        } else if (e.error === "no-speech") { toast.textContent = "Ses duyamadım. Tekrar dokun 🎤"; }
        else { toast.textContent = "Olmadı, tekrar dene 🎤"; }
      };
      rec.onend = function () { mic.classList.remove("rec"); };
      try { rec.start(); } catch (e2) { mic.classList.remove("rec"); toast.className = "toast bad"; toast.textContent = "Tekrar dokun 🎤"; }
    }
    function finish() {
      var coins = correct * 3, unlocked = award(deck.id, coins);
      addXp(xp); bumpStreak(); save();
      var stars = correct >= items.length ? 3 : correct >= Math.ceil(items.length*0.6) ? 2 : correct > 0 ? 1 : 0;
      app.innerHTML =
        (unlocked ? '<div class="unlockban">🔓 Yeni bölüm açıldı: ' + nextThemeName(deck.id) + '! 🎉</div>' : '') +
        '<div class="result"><div class="big">🎤</div><h2 class="display">Telaffuz bitti!</h2>' +
        '<div class="bigstars">' + starStr(stars) + '</div>' +
        '<p class="muted tnum">' + correct + ' / ' + items.length + ' iyi</p>' +
        '<div class="reward" style="background:var(--gold)">🪙 +' + coins + '</div> <div class="reward">⭐ +' + xp + ' XP</div>' +
        '<div style="display:flex;flex-direction:column;gap:12px"><button class="btn primary" id="again">🔁 Tekrar</button>' +
        '<button class="btn ghost" id="home">🏠 Ana sayfa</button></div></div>';
      app.querySelector("#again").onclick = function () { pronounce(deck, back); };
      app.querySelector("#home").onclick = home;
    }
  }

  // ============ YAZMA OYUNU (altın kazan!) ============
  function writing(deck, back) {
    var items = shuffle(deck.words).slice(0, Math.min(6, deck.words.length));
    var idx = 0, correct = 0, xp = 0, coins = 0;
    step();
    function step() { if (idx >= items.length) return finish(); render(items[idx], "Türkçesini gör, Almancasını yaz ✍️"); }
    function render(w, hint) {
      app.innerHTML =
        '<div class="qhead"><button class="back" id="bk">‹ Çık</button>' +
          '<div class="qbar"><i style="width:' + (idx/items.length*100) + '%"></i></div>' +
          '<div class="tnum" style="font-weight:800">' + (idx+1) + '/' + items.length + '</div></div>' +
        '<div class="qcard"><div class="qkind">✍️ Almancasını yaz — 🪙 +5 altın</div>' +
          '<div class="qword tr">' + esc(w.tr) + '</div>' +
          '<button class="speak" id="hear" style="width:44px;height:44px;font-size:19px;margin:2px auto">🔊</button></div>' +
        '<input id="inp" class="winput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Buraya yaz..." />' +
        '<div class="toast" id="toast">' + hint + '</div>' +
        '<button class="btn coin" id="ok" style="margin-top:12px">Kontrol et ✓</button>' +
        '<div style="margin-top:10px"><button class="btn ghost" id="skip">Cevabı göster ›</button></div>';
      app.querySelector("#bk").onclick = back;
      app.querySelector("#hear").onclick = function () { speak(w.de); };
      var inp = app.querySelector("#inp"); try { inp.focus(); } catch (e) {}
      app.querySelector("#ok").onclick = function () { check(w, inp.value); };
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") check(w, inp.value); });
      app.querySelector("#skip").onclick = function () {
        var t = app.querySelector("#toast"); t.className = "toast bad"; t.textContent = "Doğrusu: " + w.de;
        speak(w.de); setTimeout(function () { idx++; step(); }, 1300);
      };
    }
    function check(w, val) {
      if (!val || !val.trim()) return;
      var t = app.querySelector("#toast");
      if (norm(val) === norm(w.de)) {
        correct++; xp += 12; coins += 5;
        t.className = "toast good"; t.textContent = "Doğru! 👏 +5 🪙"; speak(w.de);
        setTimeout(function () { idx++; step(); }, 900);
      } else {
        t.className = "toast bad"; t.textContent = "Olmadı 🔁 İpucu: ilk harf “" + w.de.charAt(0) + "”";
      }
    }
    function finish() {
      var unlocked = award(deck.id, coins); addXp(xp); bumpStreak(); save();
      var stars = correct >= items.length ? 3 : correct >= Math.ceil(items.length*0.6) ? 2 : correct > 0 ? 1 : 0;
      app.innerHTML =
        (unlocked ? '<div class="unlockban">🔓 Yeni bölüm açıldı: ' + nextThemeName(deck.id) + '! 🎉</div>' : '') +
        '<div class="result"><div class="big">💰</div><h2 class="display">Altın kazandın!</h2>' +
        '<div class="bigstars">' + starStr(stars) + '</div>' +
        '<p class="muted tnum">' + correct + ' / ' + items.length + ' doğru yazıldı</p>' +
        '<div class="reward" style="background:var(--gold)">🪙 +' + coins + ' altın</div> <div class="reward">⭐ +' + xp + ' XP</div>' +
        '<div style="display:flex;flex-direction:column;gap:12px"><button class="btn coin" id="again">🔁 Tekrar (daha çok altın!)</button>' +
        '<button class="btn ghost" id="home">🏠 Ana sayfa</button></div></div>';
      app.querySelector("#again").onclick = function () { writing(deck, back); };
      app.querySelector("#home").onclick = home;
    }
  }

  // ============ SAYI OYUNU (dinle & bul) ============
  function numberGame(deck, back) {
    var nums = deck.words.map(function (w, i) { return { de:w.de, n:i+1 }; });
    var rounds = shuffle(nums).slice(0, 8);
    var idx = 0, correct = 0, xp = 0, coins = 0;
    step();
    function step() {
      if (idx >= rounds.length) return finish();
      var w = rounds[idx];
      app.innerHTML =
        '<div class="qhead"><button class="back" id="bk">‹ Çık</button>' +
          '<div class="qbar"><i style="width:' + (idx/rounds.length*100) + '%"></i></div>' +
          '<div class="tnum" style="font-weight:800">' + (idx+1) + '/' + rounds.length + '</div></div>' +
        '<div class="qcard"><div class="qkind">🔊 Hangi sayıyı duydun?</div>' +
          '<button class="speak" id="say" style="margin:8px auto;width:66px;height:66px;font-size:30px">🔊</button></div>' +
        '<div class="numgrid" id="grid"></div><div class="toast" id="toast"></div>';
      app.querySelector("#bk").onclick = back;
      app.querySelector("#say").onclick = function () { speak(w.de); };
      speak(w.de);
      var grid = app.querySelector("#grid");
      for (var i = 1; i <= 12; i++) (function (n) {
        var b = document.createElement("button"); b.className = "numbtn"; b.textContent = n;
        b.onclick = function () { pick(n, b, w); }; grid.appendChild(b);
      })(i);
    }
    function pick(n, b, w) {
      var t = app.querySelector("#toast"), btns = app.querySelectorAll(".numbtn");
      Array.prototype.forEach.call(btns, function (x) { x.disabled = true; });
      if (n === w.n) { b.classList.add("correct"); correct++; xp += 10; coins += 4; t.className = "toast good"; t.textContent = "Doğru! ✅ +4 🪙"; }
      else { b.classList.add("wrong"); btns[w.n-1].classList.add("correct"); t.className = "toast bad"; t.textContent = "Doğrusu: " + w.n + " (" + w.de + ")"; }
      speak(w.de);
      setTimeout(function () { idx++; step(); }, n === w.n ? 800 : 1300);
    }
    function finish() {
      var unlocked = award(deck.id, coins); addXp(xp); bumpStreak(); save();
      var stars = correct >= rounds.length ? 3 : correct >= 5 ? 2 : correct > 0 ? 1 : 0;
      app.innerHTML =
        (unlocked ? '<div class="unlockban">🔓 Yeni bölüm açıldı: ' + nextThemeName(deck.id) + '! 🎉</div>' : '') +
        '<div class="result"><div class="big">🔢</div><h2 class="display">Sayı ustası!</h2>' +
        '<div class="bigstars">' + starStr(stars) + '</div>' +
        '<p class="muted tnum">' + correct + ' / ' + rounds.length + ' doğru</p>' +
        '<div class="reward" style="background:var(--gold)">🪙 +' + coins + '</div> <div class="reward">⭐ +' + xp + ' XP</div>' +
        '<div style="display:flex;flex-direction:column;gap:12px"><button class="btn primary" id="again">🔁 Tekrar</button>' +
        '<button class="btn ghost" id="home">🏠 Ana sayfa</button></div></div>';
      app.querySelector("#again").onclick = function () { numberGame(deck, back); };
      app.querySelector("#home").onclick = home;
    }
  }

  applyCosmetics();
  home();
})();
</script>
